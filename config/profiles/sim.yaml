# Any computer, simulated room: drawn camera view, fake sensors and motors, fake survivors.
# No webcam or camera permission is required; scene reports and person detections come from
# the simulated room so the whole loop works.
hw:
  camera: synthetic
  distance: simworld
  motors: fake
scene:
  provider: sim
perception:
  yolo: {where: sim}
voice:
  provider: fake
sim:
  world: room_basic
  fake_people: true
server:
  host: 127.0.0.1
  open_browser: true
survivors:
  data_dir: data/sim        # keep simulated survivors out of the real (laptop / robot) records
