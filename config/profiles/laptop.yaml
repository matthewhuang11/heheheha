# Any laptop (Mac, Windows, Linux): its webcam + fake distance sliders + fake motors.
# ("--profile mac" is an alias for this profile.)
hw:
  camera: opencv
  distance: sliders
  motors: fake
scene:
  provider: xai             # Grok handles camera scenes; Gemini remains talk/triage only
perception:
  yolo: {where: robot, device: auto}
voice:
  provider: elevenlabs
  fallback: local
server:
  host: 127.0.0.1
  open_browser: true
