# Defaults for every profile. Other profiles only override what they change.
# Any value can be overridden on the command line:  python -m scoutbot --profile laptop --set hw.distance=random

hw:
  camera: opencv            # opencv | picamera2 | folder | synthetic
  camera_index: 0           # portable default; CAMERA_INDEX in .env overrides it
  camera_size: [640, 480]   # requested picamera2 capture size
  camera_folder: dataset/
  camera_fps: 15
  distance: sliders         # sliders | random | scripted | replay | simworld | hcsr04 | tof
  random_every_s: 1.0
  motors: fake              # fake | l298n
  # GPIO numbers (BCM). PLACEHOLDERS: the hardware team fills these in.
  pins:
    trig: [23, 24, 25]      # left, center, right
    echo: [17, 27, 22]      # through a 5V -> 3.3V voltage divider!
    left:  {fwd: 5,  back: 6,  en: 12}
    right: {fwd: 13, back: 19, en: 18}
  tof_xshut: [4, 16, 20]    # only for distance: tof
  sensor_angles: [30, 0, -30]   # left, center, right sensor directions (deg, CCW +); used by the sim and the map (KI-39)
  sensor_beam_deg: 15       # full beam width of each distance sensor (HC-SR04 ~15 deg)
  cliff: none               # downward floor sensor (KI-40): none | hcsr04 | tof. The sim uses its world's drops instead.
  cliff_pins: {trig: 26, echo: 21, xshut: 7}   # PLACEHOLDERS: hcsr04 uses trig/echo (echo via divider), tof uses xshut
  cliff_ahead_cm: 15        # how far ahead of the robot centre the floor sensor looks (sim)

motion:                     # measured once on the real floor (spec 5.3)
  forward_cm_s: 30
  slow_cm_s: 18
  backup_cm_s: 18
  turn_deg_s: 90
  ramp_s: 0.15
  trim_left: 1.0
  trim_right: 1.0

# Responder-operated skid-steer controls.  These are conservative PWM
# fractions, not measured metres per second.  Tune only after bench tests.
manual:
  max_forward: 0.60
  slow_factor: 0.58
  max_reverse: 0.35
  max_turn_in_place: 0.45
  deadzone: 0.08
  expo: 0.30
  trim_left: 1.0
  trim_right: 1.0
  invert_left: false
  invert_right: false
  min_start: 0.15
  require_arm: false         # true on a verified physical Pi installation
  arm_pin: null
  arm_pull_up: false

speeds:                     # [left, right] as fractions of full PWM
  STOP: [0, 0]
  FORWARD: [0.6, 0.6]
  FORWARD_SLOW: [0.35, 0.35]
  TURN_LEFT: [-0.45, 0.45]
  TURN_RIGHT: [0.45, -0.45]
  BACK_UP: [-0.35, -0.35]

safety:
  motor_watchdog_s: 0.5
  manual_cmd_valid_s: 0.3
  link_required: true       # false only for headless tests
  link_timeout_manual_s: 0.5
  link_timeout_auto_s: 2.0
  auto_on_link_loss: stop   # stop | continue
  backup_max_s: 1.5

control:
  hz: 10
  log_every_s: 0.5

scene:
  provider: gemini          # gemini | fake | sim
  interval_s: 2.0

perception:
  yolo:
    where: robot            # robot | remote | sim | off
    model: yolov8n.pt
    imgsz: 320
    device: auto            # auto | cpu | mps | cuda
    min_conf: 0.45
    confirm: [2, 3]         # person must appear in 2 of the last 3 frames
    near_frac: 0.5          # box height / image height above this = near
    mid_frac: 0.2
    max_age_s: 1.0

survivors:
  merge_cm: 85              # base merge radius (cm); 85 = best in the sim sweep (docs/scoutbot/station.md)
  bearing_deg: 25
  dist_cm: {near: 70, mid: 200, far: 400}
  max_snapshots: 5
  data_dir: data
  handled_s: 60              # 'Continue search': ignore a handled survivor for this long (KI-38)

talk:
  enabled: true
  gemini: {timeout_s: 12}    # Gemini API rejects deadlines under 10 s (400 INVALID_ARGUMENT)
  ollama: {url: "http://localhost:11434", model: "qwen2.5:3b", timeout_s: 20, keep_alive: "30m"}
  breaker: {fail_threshold: 3, open_s: 30}
  history_messages: 12       # maximum chat lines included in each model request
  prompt_version: v2         # reply_v2.txt and triage_v2.txt, with v1 fallback

voice:
  provider: elevenlabs      # elevenlabs | local | fake
  fallback: local           # local | fake
  model: eleven_flash_v2_5
  dedupe_s: 10

sync:
  sinks: auto               # follows target when configured; [] stays local only
  target: ingest            # ingest (Vultr HTTPS) | mongo (direct development fallback) | none | auto
  interval_s: 3
  backoff_max_s: 60
  telemetry_hz: 1

net:
  check_interval_s: 3
  check_url: "https://generativelanguage.googleapis.com/"
  force_offline: false

sim:
  world: room_basic
  noise: 0.05
  fake_people: true        # false: the sim camera sees nobody (tests the no-person paths)

record:                     # --record: camera frames + sensor readings for replay (C15)
  enabled: false            # --record sets this
  fps: 2                    # frames saved per second
  dir: ""                   # empty = <survivors.data_dir>/recordings/<time>

server:
  host: 127.0.0.1
  port: 8000
  test_controls: true
  state_hz: 10
  open_browser: false
