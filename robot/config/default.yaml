# config/v1 controlled baseline. Simulation and replay must never energize hardware.
config_version: config/v1
hardware:
  mode: simulation
control:
  rate_hz: 20
sensors:
  sample_rate_hz: 20
  filter_window_samples: 3
  min_distance_cm: 2.0
  max_distance_cm: 400.0
safety:
  sensor_ttl_ms: 500
  forward_stop_cm: 25.0
  permit_ttl_ms: 150
  action_renewal_ms: 500
  decision_timeout_ms: 3000
  max_missed_ticks: 3
motion:
  max_translation_mps: 0.10
  max_turn_rate_rad_s: 0.35
  max_accel_mps2: 0.20
  max_angular_accel_rad_s2: 0.50
vlm:
  request_period_ms: 2000
  timeout_ms: 4000
  scene_ttl_ms: 6000
  offline_after_failures: 3
