[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drr-v1"
version = "0.1.0"
description = "Laptop-safe reference implementation of the controlled DRR V1 baseline"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
